$kind: http-request
url: "{{baseUrl}}/rewards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "member_id": {{memberId}},
      "point_type_id": 2,
      "points": 200,
      "description": "Referred user Bob",
      "event_date": "2024-02-05T10:15:33Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
