$kind: http-request
url: "{{baseUrl}}/rewards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "member_id": {{memberId}},
      "point_type_id": 3,
      "points": 50,
      "description": "Cashback on bill payment",
      "event_date": "2024-02-10T08:45:00Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
