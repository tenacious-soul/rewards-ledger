$kind: http-request
url: "{{baseUrl}}/members/{{memberId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Balance is 450', () => pm.expect(pm.response.json().points_balance).to.eql(450));
    language: text/javascript
order: 5000
