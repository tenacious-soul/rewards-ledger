$kind: http-request
url: "{{baseUrl}}/rewards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "member_id": {{memberId}},
      "point_type_id": 4,
      "points": 1000000
    }
scripts:
  - type: afterResponse
    code: pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
    language: text/javascript
order: 3000
