$kind: http-request
url: "{{baseUrl}}/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
