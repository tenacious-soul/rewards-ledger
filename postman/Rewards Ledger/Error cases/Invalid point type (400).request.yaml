$kind: http-request
url: "{{baseUrl}}/rewards"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "member_id": {{memberId}},
      "point_type_id": 9,
      "points": 10
    }
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
