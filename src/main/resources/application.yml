spring:
  application:
    name: rewards-ledger
  datasource:
    url: jdbc:h2:mem:rewards;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
